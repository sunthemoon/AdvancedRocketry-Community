plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = mod_artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// A separate development-only mod: platform + independently compiled API, never main classes.
sourceSets {
    adapterTest {
        compileClasspath = sourceSets.main.compileClasspath + files(
                layout.buildDirectory.dir('classes/api'), layout.buildDirectory.dir('classes/rocketApi'),
                layout.buildDirectory.dir('classes/atmosphereApi'), layout.buildDirectory.dir('classes/environmentApi'),
                layout.buildDirectory.dir('classes/satelliteApi'), layout.buildDirectory.dir('classes/endgameApi'))
        runtimeClasspath = output + sourceSets.main.runtimeClasspath
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            if (project.hasProperty('arceEvidenceRun')) {
                def evidenceInstance = project.findProperty('arceEvidenceInstance')?.toString() ?: 'game'
                if (!(evidenceInstance ==~ /[A-Za-z0-9_-]{1,32}/)) {
                    throw new GradleException('arceEvidenceInstance must be a bounded directory name')
                }
                workingDirectory project.file("build/client-evidence/${evidenceInstance}")
                args '--width', '960', '--height', '540'
            }
            if (project.hasProperty('arceEvidenceUsername')) {
                def evidenceUsername = project.property('arceEvidenceUsername').toString()
                if (!(evidenceUsername ==~ /[A-Za-z0-9_]{3,16}/)) {
                    throw new GradleException('arceEvidenceUsername must be a valid offline username')
                }
                args '--username', evidenceUsername
            }
            if (project.hasProperty('arceQuickPlaySingleplayer')) {
                args '--quickPlaySingleplayer', project.property('arceQuickPlaySingleplayer').toString()
            }
            if (project.hasProperty('arceQuickPlayMultiplayer')) {
                args '--quickPlayMultiplayer', project.property('arceQuickPlayMultiplayer').toString()
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', "${mod_id},arce_adapter_test"
            mods {
                arce_adapter_test {
                    source sourceSets.adapterTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/v1.8/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', file('src/generated/resources/'),
                    '--existing', file('src/generated/v0.2/resources/'),
                    '--existing', file('src/generated/v0.3/resources/'),
                    '--existing', file('src/generated/v0.4/resources/'),
                    '--existing', file('src/generated/v0.5/resources/'),
                    '--existing', file('src/generated/v0.6/resources/'),
                    '--existing', file('src/generated/v0.7/resources/'),
                    '--existing', file('src/generated/v0.8/resources/'),
                    '--existing', file('src/generated/v1.2/resources/'),
                    '--existing', file('src/generated/v1.3/resources/'),
                    '--existing', file('src/generated/v1.4/resources/'),
                    '--existing', file('src/generated/v1.5/resources/'),
                    '--existing', file('src/generated/v1.6/resources/'),
                    '--existing', file('src/generated/v1.7/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/v0.2/resources'
    srcDir 'src/generated/v0.3/resources'
    srcDir 'src/generated/v0.4/resources'
    srcDir 'src/generated/v0.5/resources'
    srcDir 'src/generated/v0.6/resources'
    srcDir 'src/generated/v0.7/resources'
    srcDir 'src/generated/v0.8/resources'
    srcDir 'src/generated/v1.2/resources'
    srcDir 'src/generated/v1.3/resources'
    srcDir 'src/generated/v1.4/resources'
    srcDir 'src/generated/v1.5/resources'
    srcDir 'src/generated/v1.6/resources'
    srcDir 'src/generated/v1.7/resources'
    srcDir 'src/generated/v1.8/resources'
    exclude '.cache/**'
}

def currentSupersededHistoricalBlockTags = [
        'data/minecraft/tags/blocks/mineable/pickaxe.json',
        'data/minecraft/tags/blocks/needs_iron_tool.json'
] as Set

def currentSupersededV030Types = [
        'data/advancedrocketrycommunity/dimension_type/moon.json',
        'data/advancedrocketrycommunity/dimension_type/space.json'
] as Set

def currentSatelliteDefinition = 'data/advancedrocketrycommunity/satellite_definitions/data_satellite.json'

// ADR-063 section 8: the v1.8 copies of the Moon, Mars and Venus dimensions and of the Mars and Venus noise
// settings (new biome sources and surface rules, the noise router unchanged) supersede these earlier copies.
def supersededV030Planets = [
        'data/advancedrocketrycommunity/dimension/moon.json'
] as Set
def supersededV140Planets = [
        'data/advancedrocketrycommunity/dimension/mars.json',
        'data/advancedrocketrycommunity/dimension/venus.json',
        'data/advancedrocketrycommunity/worldgen/noise_settings/mars.json',
        'data/advancedrocketrycommunity/worldgen/noise_settings/venus.json'
] as Set

tasks.named('processResources') {
    eachFile { details ->
        // ADR-043: the v1.5 copy is authoritative; the v0.8 and v1.4 copies are superseded.
        if ((details.file.toPath().startsWith(file('src/generated/v0.8/resources').toPath())
                || details.file.toPath().startsWith(file('src/generated/v1.4/resources').toPath()))
                && details.path == currentSatelliteDefinition) {
            details.exclude()
        }
        // ADR-044: the v1.5 tool tags add the warp core and supersede the v1.2 copies;
        // ADR-049: the v1.6 tool tags add the satellite builder and supersede the v1.5 copies;
        // ADR-054: the v1.7 tool tags add the endgame casing and supersede the v1.6 copies;
        // ADR-063: the v1.8 tool tags add the material blocks and supersede the v1.7 copies.
        boolean isHistoricalCopy = details.file.toPath().startsWith(
                file('src/generated/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v0.8/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.2/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.5/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.6/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.7/resources').toPath()
        )
        if (isHistoricalCopy && currentSupersededHistoricalBlockTags.contains(details.path)) {
            details.exclude()
        }
        if (details.file.toPath().startsWith(file('src/generated/v0.3/resources').toPath())
                && currentSupersededV030Types.contains(details.path)) {
            details.exclude()
        }
        if ((details.file.toPath().startsWith(file('src/generated/v0.3/resources').toPath())
                && supersededV030Planets.contains(details.path))
                || (details.file.toPath().startsWith(file('src/generated/v1.4/resources').toPath())
                && supersededV140Planets.contains(details.path))) {
            details.exclude()
        }
    }
}

tasks.named('sourcesJar') {
    eachFile { details ->
        // ADR-043: the v1.5 copy is authoritative; the v0.8 and v1.4 copies are superseded.
        if ((details.file.toPath().startsWith(file('src/generated/v0.8/resources').toPath())
                || details.file.toPath().startsWith(file('src/generated/v1.4/resources').toPath()))
                && details.path == currentSatelliteDefinition) {
            details.exclude()
        }
        // ADR-044: the v1.5 tool tags add the warp core and supersede the v1.2 copies;
        // ADR-049: the v1.6 tool tags add the satellite builder and supersede the v1.5 copies;
        // ADR-054: the v1.7 tool tags add the endgame casing and supersede the v1.6 copies;
        // ADR-063: the v1.8 tool tags add the material blocks and supersede the v1.7 copies.
        boolean isHistoricalCopy = details.file.toPath().startsWith(
                file('src/generated/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v0.8/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.2/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.5/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.6/resources').toPath()
        ) || details.file.toPath().startsWith(
                file('src/generated/v1.7/resources').toPath()
        )
        if (isHistoricalCopy && currentSupersededHistoricalBlockTags.contains(details.path)) {
            details.exclude()
        }
        if (details.file.toPath().startsWith(file('src/generated/v0.3/resources').toPath())
                && currentSupersededV030Types.contains(details.path)) {
            details.exclude()
        }
        if ((details.file.toPath().startsWith(file('src/generated/v0.3/resources').toPath())
                && supersededV030Planets.contains(details.path))
                || (details.file.toPath().startsWith(file('src/generated/v1.4/resources').toPath())
                && supersededV140Planets.contains(details.path))) {
            details.exclude()
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'JaredsMaven'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

def includeJeiRuntime = (findProperty('arceIncludeJei') ?: 'false').toString()
if (includeJeiRuntime != 'true' && includeJeiRuntime != 'false') {
    throw new GradleException('arceIncludeJei must be exactly true or false')
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if (includeJeiRuntime == 'true') {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('importLegacyCelestial', JavaExec) {
    group = 'advanced rocketry community'
    description = 'Convert one legacy planetDefs.xml/Template.xml into canonical bounded celestial JSON.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.sunthemoon.advancedrocketrycommunity.celestial.legacy.LegacyCelestialImportCli'
    doFirst {
        if (!project.hasProperty('legacyXml') || !project.hasProperty('legacyOutput')) {
            throw new GradleException('Use -PlegacyXml=<file> -PlegacyOutput=<empty-directory>')
        }
        args = [
                project.property('legacyXml').toString(),
                project.property('legacyOutput').toString()
        ]
    }
}

def gameTestStartedAt = 0L
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // Every run starts from a fresh world: entities an earlier run saved can load after a test cleared its area.
        delete file('build/gametest/world')
        gameTestStartedAt = System.currentTimeMillis()
    }
    doLast {
        File latestLog = file('build/gametest/logs/latest.log')
        if (!latestLog.isFile() || latestLog.lastModified() < gameTestStartedAt - 2_000L) {
            throw new GradleException('Forge GameTest did not produce a fresh latest.log')
        }
        String logText = latestLog.getText('UTF-8')
        if (!(logText =~ /All \d+ required tests passed/).find()) {
            throw new GradleException('Forge GameTest completion marker is missing from latest.log')
        }
    }
}

def resourceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : project.version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
        mod_description        : mod_description,
        jei_version_range      : jei_version_range
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties resourceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
    from(rootProject.file('docs/licenses')) {
        into 'META-INF/licenses'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }

    finalizedBy 'reobfJar'
}

// This independent compilation prevents API types from acquiring platform dependencies.
def apiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/version'
def exportedApiTypes = ['ApiVersion', 'ApiCompatibility', 'ApiVersions']
def rocketApiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/rocket'
def exportedRocketApiTypes = ['RocketBlockEntityAdapter', 'RocketAdapterRegistrar', 'RegisterRocketAdaptersEvent',
                             'RocketComponentDefinition', 'RocketComponentRegistrar', 'RegisterRocketComponentsEvent',
                             'RocketFuelDefinition', 'RocketFuelRegistrar', 'RegisterRocketFuelsEvent']
def atmosphereApiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/atmosphere'
def exportedAtmosphereApiTypes = ['AtmosphereBoundary', 'AtmosphereBoundaryProvider',
                                  'AtmosphereBoundaryRegistrar', 'RegisterAtmosphereBoundariesEvent',
                                  'SuitOxygenProvider', 'SuitEquipmentRegistrar', 'RegisterSuitEquipmentEvent']
def environmentApiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/environment'
def exportedEnvironmentApiTypes = ['AtmosphereProfile', 'EnvironmentSnapshot', 'EnvironmentQueries',
                                   'ServerEnvironmentReadyEvent']
def satelliteApiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/satellite'
def exportedSatelliteApiTypes = ['SatelliteMissionDefinition', 'SatellitePayloadRegistrar', 'RegisterSatellitePayloadsEvent']
def endgameApiPackage = 'io/github/sunthemoon/advancedrocketrycommunity/api/endgame'
def exportedEndgameApiTypes = ['EndgameEffect', 'EndgameEffectEvent']
def exportedApiClasses = exportedApiTypes.collect { "${apiPackage}/${it}.class" } +
        exportedRocketApiTypes.collect { "${rocketApiPackage}/${it}.class" } +
        exportedAtmosphereApiTypes.collect { "${atmosphereApiPackage}/${it}.class" } +
        exportedEnvironmentApiTypes.collect { "${environmentApiPackage}/${it}.class" } +
        exportedSatelliteApiTypes.collect { "${satelliteApiPackage}/${it}.class" } +
        exportedEndgameApiTypes.collect { "${endgameApiPackage}/${it}.class" } +
        ["${environmentApiPackage}/EnvironmentSnapshot\$Locus.class"]
def compileApiJava = tasks.register('compileApiJava', JavaCompile) {
    source exportedApiTypes.collect { "src/main/java/${apiPackage}/${it}.java" }
    classpath = files()
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/api')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def compileRocketApiJava = tasks.register('compileRocketApiJava', JavaCompile) {
    source exportedRocketApiTypes.collect { "src/main/java/${rocketApiPackage}/${it}.java" }
    classpath = sourceSets.main.compileClasspath + files(compileApiJava.flatMap { it.destinationDirectory })
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/rocketApi')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def compileAtmosphereApiJava = tasks.register('compileAtmosphereApiJava', JavaCompile) {
    source exportedAtmosphereApiTypes.collect { "src/main/java/${atmosphereApiPackage}/${it}.java" }
    classpath = sourceSets.main.compileClasspath + files(compileApiJava.flatMap { it.destinationDirectory })
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/atmosphereApi')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def compileEnvironmentApiJava = tasks.register('compileEnvironmentApiJava', JavaCompile) {
    source exportedEnvironmentApiTypes.collect { "src/main/java/${environmentApiPackage}/${it}.java" }
    classpath = sourceSets.main.compileClasspath
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/environmentApi')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def compileSatelliteApiJava = tasks.register('compileSatelliteApiJava', JavaCompile) {
    source exportedSatelliteApiTypes.collect { "src/main/java/${satelliteApiPackage}/${it}.java" }
    classpath = sourceSets.main.compileClasspath
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/satelliteApi')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
