// Modified by AdvancedRocketry-Community on 2026-08-26, 2026-08-27, 2026-08-28, 2026-08-30, and 2026-08-31; see THIRD-PARTY-NOTICES.md.
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = mod_artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            if (project.hasProperty('arceEvidenceRun')) {
                workingDirectory project.file('build/client-evidence/game')
                args '--width', '960', '--height', '540'
            }
            if (project.hasProperty('arceQuickPlaySingleplayer')) {
                args '--quickPlaySingleplayer', project.property('arceQuickPlaySingleplayer').toString()
            }
            if (project.hasProperty('arceQuickPlayMultiplayer')) {
                args '--quickPlayMultiplayer', project.property('arceQuickPlayMultiplayer').toString()
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('build/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/v0.7/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', file('src/generated/resources/'),
                    '--existing', file('src/generated/v0.2/resources/'),
                    '--existing', file('src/generated/v0.3/resources/'),
                    '--existing', file('src/generated/v0.4/resources/'),
                    '--existing', file('src/generated/v0.5/resources/'),
                    '--existing', file('src/generated/v0.6/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/v0.2/resources'
    srcDir 'src/generated/v0.3/resources'
    srcDir 'src/generated/v0.4/resources'
    srcDir 'src/generated/v0.5/resources'
    srcDir 'src/generated/v0.6/resources'
    srcDir 'src/generated/v0.7/resources'
    exclude '.cache/**'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('importLegacyCelestial', JavaExec) {
    group = 'advanced rocketry community'
    description = 'Convert one legacy planetDefs.xml/Template.xml into canonical bounded celestial JSON.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.sunthemoon.advancedrocketrycommunity.celestial.legacy.LegacyCelestialImportCli'
    doFirst {
        if (!project.hasProperty('legacyXml') || !project.hasProperty('legacyOutput')) {
            throw new GradleException('Use -PlegacyXml=<file> -PlegacyOutput=<empty-directory>')
        }
        args = [
                project.property('legacyXml').toString(),
                project.property('legacyOutput').toString()
        ]
    }
}

def gameTestStartedAt = 0L
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        gameTestStartedAt = System.currentTimeMillis()
    }
    doLast {
        File latestLog = file('build/gametest/logs/latest.log')
        if (!latestLog.isFile() || latestLog.lastModified() < gameTestStartedAt - 2_000L) {
            throw new GradleException('Forge GameTest did not produce a fresh latest.log')
        }
        String logText = latestLog.getText('UTF-8')
        if (!(logText =~ /All \d+ required tests passed/).find()) {
            throw new GradleException('Forge GameTest completion marker is missing from latest.log')
        }
    }
}

def resourceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : project.version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties resourceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) {
        into 'META-INF'
    }
    from(rootProject.file('docs/licenses')) {
        into 'META-INF/licenses'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        maven {
            name = 'localProjectRepository'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
