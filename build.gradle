def compileEndgameApiJava = tasks.register('compileEndgameApiJava', JavaCompile) {
    source exportedEndgameApiTypes.collect { "src/main/java/${endgameApiPackage}/${it}.java" }
    classpath = sourceSets.main.compileClasspath
    options.sourcepath = files()
    options.annotationProcessorPath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/endgameApi')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('compileAdapterTestJava', JavaCompile) {
    dependsOn compileApiJava, compileRocketApiJava, compileAtmosphereApiJava, compileEnvironmentApiJava, compileSatelliteApiJava,
            compileEndgameApiJava
    options.sourcepath = files()
    options.annotationProcessorPath = files()
}

tasks.named('check') {
    dependsOn 'compileAdapterTestJava'
}

def apiJar = tasks.register('apiJar', Jar) {
    dependsOn compileApiJava, compileRocketApiJava, compileAtmosphereApiJava, compileEnvironmentApiJava, compileSatelliteApiJava,
            compileEndgameApiJava, 'reobfJar'
    archiveClassifier = 'api'
    // Publish the actual runtime bytes; Forge's remapper can rewrite even JDK-only classes.
    from({ zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile) }) {
        include exportedApiClasses
    }
}

tasks.named('assemble') {
    dependsOn apiJar
}

tasks.named('test', Test) {
    dependsOn apiJar, 'reobfJar'
    inputs.file(apiJar.flatMap { it.archiveFile })
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    systemProperty 'arce.apiJar', apiJar.get().archiveFile.get().asFile.absolutePath
    systemProperty 'arce.runtimeJar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    inputs.files(sourceSets.main.compileClasspath)
    doFirst {
        systemProperty 'arce.apiPlatformClasspath', sourceSets.main.compileClasspath.asPath
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_artifact_id
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }

    repositories {
        maven {
            name = 'localProjectRepository'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
