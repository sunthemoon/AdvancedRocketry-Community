import groovy.json.JsonOutput
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.gradle.api.artifacts.ProjectDependency

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'io.github.sunthemoon.advancedrocketrycommunity.compat'
version = '1.0.0'
base.archivesName = 'arce-adapter-compat-test'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft.mappings channel: 'official', version: '1.20.1'

def hostGroup = 'io.github.sunthemoon.advancedrocketrycommunity'
def hostArtifact = 'advancedrocketry-community'
def hostVersion = providers.gradleProperty('arceVersion').getOrElse('1.20.1-1.4.0-dev')
def hostCoordinates = "${hostGroup}:${hostArtifact}:${hostVersion}:api"
def hostRepository = file(providers.gradleProperty('arceRepository').getOrElse('../build/repo'))
def hostPrefix = 'io/github/sunthemoon/advancedrocketrycommunity/'
def exportedClasses = [
        'api/version/ApiVersion.class', 'api/version/ApiCompatibility.class',
        'api/version/ApiVersions.class', 'api/rocket/RocketBlockEntityAdapter.class',
        'api/rocket/RocketAdapterRegistrar.class', 'api/rocket/RegisterRocketAdaptersEvent.class',
        'api/atmosphere/AtmosphereBoundary.class', 'api/atmosphere/AtmosphereBoundaryProvider.class',
        'api/atmosphere/AtmosphereBoundaryRegistrar.class', 'api/atmosphere/RegisterAtmosphereBoundariesEvent.class',
        'api/atmosphere/SuitOxygenProvider.class', 'api/atmosphere/SuitEquipmentRegistrar.class',
        'api/atmosphere/RegisterSuitEquipmentEvent.class',
        'api/rocket/RocketComponentDefinition.class', 'api/rocket/RocketComponentRegistrar.class',
        'api/rocket/RegisterRocketComponentsEvent.class',
        'api/rocket/RocketFuelDefinition.class', 'api/rocket/RocketFuelRegistrar.class',
        'api/rocket/RegisterRocketFuelsEvent.class',
        'api/environment/AtmosphereProfile.class', 'api/environment/EnvironmentSnapshot.class',
        'api/environment/EnvironmentSnapshot$Locus.class', 'api/environment/EnvironmentQueries.class',
        'api/environment/ServerEnvironmentReadyEvent.class',
        'api/satellite/SatelliteMissionDefinition.class', 'api/satellite/SatellitePayloadRegistrar.class',
        'api/satellite/RegisterSatellitePayloadsEvent.class'
].collect { hostPrefix + it }.toSet()

repositories {
    maven {
        name = 'arcePublishedArtifacts'
        url = hostRepository.toURI()
        content { includeGroup hostGroup }
    }
    mavenCentral { content { excludeGroup hostGroup } }
}

configurations {
    publishedApi {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly(fg.deobf(hostCoordinates)) { transitive = false }
    publishedApi(hostCoordinates) { transitive = false }
}

// Shared fixture source, not host source/output or an included/project build.
sourceSets.main {
    java.setSrcDirs([file('../src/adapterTest/java')])
    resources.setSrcDirs([file('../src/adapterTest/resources')])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.sourcepath = files()
    options.annotationProcessorPath = files()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from('../LICENSE') { into 'META-INF' }
    from('../NOTICE.md') { into 'META-INF' }
    finalizedBy 'reobfJar'
}

def sha256 = { File input ->
    def digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def entries = { File input ->
    new ZipFile(input).withCloseable { archive ->
        archive.entries().findAll { !it.directory }.collect { it.name }
    }
}
def report = { String name, Object value ->
    File output = layout.buildDirectory.file("reports/consumer/${name}").get().asFile
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
}
def require = { boolean condition, String message ->
    if (!condition) {
        throw new GradleException(message)
    }
}

def verifyApiClasspath = tasks.register('verifyApiClasspath') {
    group = 'verification'
    description = 'Audit published and Forge-remapped API provenance and the real consumer compile classpath.'
    inputs.files(configurations.publishedApi, sourceSets.main.compileClasspath)
    doLast {
        require(rootProject == project && allprojects.size() == 1 && gradle.includedBuilds.empty,
                'The consumer must remain an independent single-project build')
        require(configurations.compileClasspath.allDependencies.findAll { it instanceof ProjectDependency }.empty,
                'Project dependencies cannot supply host implementation classes')
        def rawArtifacts = configurations.publishedApi.resolvedConfiguration.resolvedArtifacts.toList()
        require(rawArtifacts.size() == 1, 'Expected one published API classifier artifact')
        def raw = rawArtifacts.first()
        require(raw.moduleVersion.id.group == hostGroup && raw.name == hostArtifact
                && raw.moduleVersion.id.version == hostVersion && raw.classifier == 'api',
                'Published artifact coordinates/classifier differ from the requested API')
        File published = new File(hostRepository,
                "${hostGroup.replace('.', '/')}/${hostArtifact}/${hostVersion}/${hostArtifact}-${hostVersion}-api.jar")
        require(published.isFile() && sha256(published) == sha256(raw.file),
                'Resolved raw API differs from the explicitly selected local Maven publication')
        require(entries(raw.file).findAll { it.endsWith('.class') }.toSet() == exportedClasses,
                'Published API contains a different exported class surface')

        def artifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.toList()
        def hostApis = artifacts.findAll { it.moduleVersion.id.group == hostGroup }
        require(hostApis.size() == 1 && hostApis.first().name == hostArtifact
                && hostApis.first().classifier == 'api',
                'Compile classpath must resolve exactly one host artifact: the API classifier')
        File mappedApi = hostApis.first().file.canonicalFile
        require(mappedApi != raw.file.canonicalFile,
                'ForgeGradle must resolve its remapped API rather than compile directly against the SRG artifact')
        def classpath = sourceSets.main.compileClasspath.files.sort { it.absolutePath }.collect { File dependency ->
            require(dependency.isFile() && dependency.name.endsWith('.jar'),
                    "Only dependency JARs are allowed on the compile classpath: ${dependency}")
            def classes = entries(dependency).findAll { it.endsWith('.class') }
            def hostClasses = classes.findAll { it.contains(hostPrefix) }.toSet()
            if (dependency.canonicalFile == mappedApi) {
                require(classes.toSet() == exportedClasses, 'Remapped API has unexpected classes')
            } else {
                require(hostClasses.empty, "Host classes leaked through platform dependency ${dependency}")
            }
            [file: dependency.absolutePath, sha256: sha256(dependency), host_classes: hostClasses.sort()]
        }
        require(sourceSets.main.compileClasspath.files.collect { it.canonicalFile }.contains(mappedApi),
                'The remapped classifier is absent from the actual compile classpath')
        def resolved = artifacts.collect {
            [group: it.moduleVersion.id.group, name: it.name, version: it.moduleVersion.id.version,
             classifier: it.classifier, file: it.file.absolutePath]
        }.sort { it.file }
        report('classpath.json', [requested_api: hostCoordinates, published_file: published.absolutePath,
                published_sha256: sha256(published), raw_api: raw.file.absolutePath,
                remapped_api: mappedApi.absolutePath, remapped_sha256: sha256(mappedApi),
                resolved_artifacts: resolved, compile_classpath: classpath,
                fixture_sources: sourceSets.main.allSource.files.sort { it.absolutePath }.collect {
                    [file: it.absolutePath, sha256: sha256(it)]
                }])
    }
}

tasks.named('compileJava') { dependsOn verifyApiClasspath }

def verifyConsumerBoundary = tasks.register('verifyConsumerBoundary') {
    group = 'verification'
    description = 'Reject an internal import and audit the independently reobfuscated fixture JAR.'
    dependsOn 'classes', 'reobfJar', verifyApiClasspath
    doLast {
        File hostJar = new File(hostRepository,
                "${hostGroup.replace('.', '/')}/${hostArtifact}/${hostVersion}/${hostArtifact}-${hostVersion}.jar")
        String internalType = hostPrefix + 'rocket/forge/RocketBlockEntityAdapter.class'
        require(hostJar.isFile() && entries(hostJar).contains(internalType),
                'The negative fixture must refer to an existing internal class in the published normal host JAR')
        File compiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get().executablePath.asFile
        File emptySource = new File(temporaryDir, 'empty-source')
        File output = new File(temporaryDir, 'negative-classes')
        emptySource.mkdirs()
        output.mkdirs()
        def diagnostics = new ByteArrayOutputStream()
        def result = exec {
            executable compiler
            args '--release', '17', '-encoding', 'UTF-8', '-proc:none', '-XDrawDiagnostics',
                    '-classpath', sourceSets.main.compileClasspath.asPath,
                    '-sourcepath', emptySource.absolutePath, '-d', output.absolutePath,
                    file('negative-fixture/InternalImportProbe.java').absolutePath
            standardOutput = diagnostics
            errorOutput = diagnostics
            ignoreExitValue = true
        }
        String text = diagnostics.toString('UTF-8')
        report('negative-import.json', [compiler: compiler.absolutePath, exit_code: result.exitValue,
                existing_internal_type: internalType, inspected_host_jar: hostJar.absolutePath,
                inspected_host_sha256: sha256(hostJar),
                compile_classpath: sourceSets.main.compileClasspath.files.collect { it.absolutePath },
                diagnostics: text])
        require(result.exitValue == 1
                && text.contains('compiler.err.doesnt.exist: io.github.sunthemoon.advancedrocketrycommunity.rocket.forge'),
                "Internal import must fail because the real host implementation package is unavailable: ${text}")
        require(text.readLines().findAll { it.contains('compiler.err.') }.every {
            it.contains('compiler.err.doesnt.exist:') || it.contains('compiler.err.cant.resolve.location:')
        }, "Negative compilation failed for an unrelated reason: ${text}")

        File jar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def names = entries(jar)
        def classes = names.findAll { it.endsWith('.class') }
        require(!classes.empty && classes.every { it.startsWith('io/github/sunthemoon/arceadaptertest/') },
                'Fixture JAR must not bundle ARCE API, host internals or platform classes')
        require(names.toSet().size() == names.size(), 'Fixture JAR has duplicate entries')
        require(names.contains('META-INF/mods.toml') && names.contains('META-INF/LICENSE')
                && names.contains('META-INF/NOTICE.md') && names.contains('pack.mcmeta')
                && !names.any { it.startsWith('META-INF/jarjar/') }, 'Fixture archive metadata is incomplete or shaded')
        report('fixture-artifact.json', [file: jar.absolutePath, bytes: jar.length(),
                sha256: sha256(jar), entries: names.sort(), reobfuscated: true])
    }
}

tasks.named('check') { dependsOn verifyConsumerBoundary }
