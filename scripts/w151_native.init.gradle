// Explicit test artifact only; the regular production JAR never contains these observers.
allprojects {
    afterEvaluate { project ->
        tasks.register('w151NativeJar', Jar) {
            dependsOn tasks.named('testClasses')
            archiveClassifier = 'w151-native'
            from sourceSets.main.output
            from(sourceSets.test.output) { include '**/W151Native*.class' }
            manifest.from tasks.named('jar', Jar).get().manifest
        }
        project.reobf.create('w151NativeJar')
    }
}
