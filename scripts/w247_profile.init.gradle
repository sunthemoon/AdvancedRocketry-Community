// Test-only profiling of the existing GameTest runner; no batch reordering or product instrumentation.
gradle.projectsEvaluated {
    rootProject.tasks.named('runGameTestServer').configure {
        doFirst {
            def batches = project.findProperty('w247Batches')
            if (batches) {
                systemProperty 'advancedrocketrycommunity.gameTestBatches', batches.toString()
            }
            def profile = project.findProperty('w247Profile')
            if (profile) {
                jvmArgs "-XX:StartFlightRecording=filename=${profile},settings=profile,dumponexit=true,maxsize=256M",
                        '-XX:FlightRecorderOptions=stackdepth=128'
            }
        }
    }
}
