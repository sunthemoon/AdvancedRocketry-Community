modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/sunthemoon/AdvancedRocketry-Community/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/sunthemoon/AdvancedRocketry-Community"
logoFile="advancedrocketrycommunity.png"
logoBlur=false
credits="${mod_credits}"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
features={java_version="[17,)"}
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
