name: Repository governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository-docs:
    runs-on: ubuntu-latest
    env:
      REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVIEW_COMMIT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test repository validator
        run: python -m unittest discover -s tests -v

      - name: Validate bootstrap provenance allowlist
        run: python scripts/validate_bootstrap_provenance.py

      - name: Check out exact Advanced Rocketry 1.12 audit source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Advanced-Rocketry/AdvancedRocketry.git build/upstream/AdvancedRocketry
          git -C build/upstream/AdvancedRocketry checkout --detach c5cd5af62fc07cd4e0d24f06a16033f181c47c04

      - name: Verify v0.1.0 audit and provenance transforms
        run: |
          python tools/audit/audit_upstream.py verify --upstream build/upstream/AdvancedRocketry --commit c5cd5af62fc07cd4e0d24f06a16033f181c47c04
          python tools/import/import_v010_assets.py verify --upstream build/upstream/AdvancedRocketry
          python scripts/manage_v010_generated_manifest.py verify
          python scripts/validate_v010_asset_baseline.py
          python scripts/validate_v010_release_evidence.py

      - name: Generate and verify commit-bound G0 review packet
        run: |
          python -I -S -c "from pathlib import Path; Path('build').mkdir(exist_ok=True)"
          python -I -S scripts/prepare_v002_g0_review_packet.py generate --commit "$REVIEW_COMMIT" --output build/v0.0.2-g0-review-packet
          python -I -S scripts/prepare_v002_g0_review_packet.py verify --commit "$REVIEW_COMMIT" --packet build/v0.0.2-g0-review-packet

      - name: Generate and verify final G0 source review inputs
        run: |
          python -I -S -c "from pathlib import Path; Path('build').mkdir(exist_ok=True)"
          python -I -S scripts/prepare_v002_final_g0_review_inputs.py generate --commit "$REVIEW_COMMIT" --output build/v0.0.2-final-g0-review-inputs
          python -I -S scripts/prepare_v002_final_g0_review_inputs.py verify --commit "$REVIEW_COMMIT" --output build/v0.0.2-final-g0-review-inputs

      - name: Enforce governance baseline
        run: python scripts/validate_repository.py --require-approved-identity

      - name: Upload commit-bound G0 review packet
        uses: actions/upload-artifact@v7
        with:
          name: v0.0.2-g0-review-packet-${{ env.REVIEW_COMMIT }}
          if-no-files-found: error
          include-hidden-files: true
          path: build/v0.0.2-g0-review-packet/

      - name: Upload final G0 source review inputs
        uses: actions/upload-artifact@v7
        with:
          name: v0.0.2-final-g0-review-inputs-${{ env.REVIEW_COMMIT }}
          if-no-files-found: error
          include-hidden-files: true
          path: build/v0.0.2-final-g0-review-inputs/
