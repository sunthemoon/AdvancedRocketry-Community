mod_description=An unofficial community rewrite of Advanced Rocketry for Minecraft 1.20.1 Forge.\nThis v1.8.0 development build adds the classic material set to the endgame development baseline: titanium, aluminum, tin, steel, iridium, dilithium, silicon and the two titanium alloys with their ingots, nuggets, dusts, plates, sheets, rods, gears, fans, boules, coils and storage blocks, Overworld tin, rutile, aluminum and dilithium ores, and the small plate press. The planetary surfaces, classic machines and parts, the rocket and station parts and release validation remain in progress.\n\nNOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
